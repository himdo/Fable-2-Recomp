name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Check generated version files
        run: python tools/generate_game_versions.py --check
      - name: Install Python test tools
        run: python -m pip install -r tests/requirements.txt
      - name: Python tests
        # Windows runners print in cp1252, which garbles pytest-spec's pass and xfail symbols.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest --cov=tools --cov-report=term
      - name: Launcher tests
        run: dotnet run --project tests/Fable2.Launcher.ConfigTests -c Release
      - name: Check out the SDK sources the native tests use
        # Only the SDK and the three header libraries the tests include, not the
        # SDK's other submodules (FFmpeg, SDL, the Vulkan libraries and so on).
        shell: bash
        run: |
          git submodule update --init --depth 1 thirdparty/rexglue-sdk
          git -C thirdparty/rexglue-sdk submodule update --init --depth 1 \
            thirdparty/fmt thirdparty/simde thirdparty/spdlog
      - name: Native tests
        shell: cmd
        run: |
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          clang++ --version
          tests\run_native_tests.cmd
