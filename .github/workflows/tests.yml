name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits, so the manifest naming check can compare with HEAD's parent.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Check generated version files
        run: python tools/generate_game_versions.py --check
      - name: Check manifest naming rules
        # On a pull request HEAD is GitHub's merge of the branch into master, so
        # HEAD~1 is master and only the entries the PR adds or renames are
        # checked. On a push to master HEAD~1 is the commit before it.
        shell: bash
        run: python tools/check_manifest_names.py --base HEAD~1
      - name: Install Python test tools
        run: python -m pip install -r tests/requirements.txt
      - name: Python tests
        # Windows runners print in cp1252, which garbles pytest-spec's pass and xfail symbols.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest --cov=tools --cov-report=term
      - name: Launcher tests
        run: dotnet run --project tests/Fable2.Launcher.ConfigTests -c Release
      - name: Check out the SDK sources the native tests use
        # Only the SDK, the three header libraries the tests include and Catch2,
        # not the SDK's other submodules (FFmpeg, SDL, the Vulkan libraries...).
        shell: bash
        run: |
          git submodule update --init --depth 1 thirdparty/rexglue-sdk
          git -C thirdparty/rexglue-sdk submodule update --init --depth 1 \
            thirdparty/fmt thirdparty/simde thirdparty/spdlog thirdparty/catch2
      - name: Install LLVM
        # The runner's own LLVM (C:\Program Files\LLVM) lags behind its Visual
        # Studio: the STL of MSVC 14.52 and later refuses Clang older than 22
        # (error STL1000). Pinned to a release, checked against its SHA-256 from
        # the GitHub release. The .tar.xz, not the smaller .tar.zst: Windows' tar
        # can't unpack that one (it needs zstd's long window).
        shell: pwsh
        env:
          LLVM_VERSION: "23.1.5"
          LLVM_SHA256: "62fdada7f6fa2b73856486dfbbdba3d2c1882991621615bcb55c60207611c6d4"
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $name = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc"
          $archive = Join-Path $env:RUNNER_TEMP "$name.tar.xz"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$name.tar.xz" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:LLVM_SHA256) { throw "LLVM archive SHA-256 is $hash, expected $env:LLVM_SHA256" }
          # Windows' tar, not Git's GNU tar, which reads C: as a remote host.
          & "$env:SystemRoot\System32\tar.exe" -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
          Remove-Item $archive
          $bin = Join-Path $env:RUNNER_TEMP "$name\bin"
          if (-not (Test-Path "$bin\clang++.exe")) { throw "clang++.exe not found in $bin" }
          $bin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          # The versions the native tests depend on, for when this breaks again.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          "Visual Studio: $vs"
          if ($vs -and (Test-Path "$vs\VC\Tools\MSVC")) {
            "MSVC toolsets: " + ((Get-ChildItem "$vs\VC\Tools\MSVC" -Directory).Name -join ', ')
          }
          & "$bin\clang++.exe" --version
      - name: Native tests (with coverage)
        shell: cmd
        env:
          FABLE2_COVERAGE: "1"
        run: |
          where clang++
          clang++ --version
          tests\run_native_tests.cmd
