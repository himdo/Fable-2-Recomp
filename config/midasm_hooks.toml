# Fable 2 mid-asm hooks
#
# Loaded from fable_2_manifest.toml via `includes` (paths resolve relative to
# that file's directory). NOTE: included files use root-level tables, so the
# entries below are [[midasm_hook]] (NOT [[entrypoint.midasm_hook]]); the
# codegen loader applies each included file's root table, not an [entrypoint]
# sub-table. Mid-asm hooks inject a C++ function (defined in
# src/core/fable2_hooks.cpp) right after a specific guest instruction to
# rewrite registers -- the recompiled-code equivalent of a Xenia code-region
# byte-patch, since guest .text is never executed here. Codegen emits each
# hook's extern prototype automatically. Hooks are keyed by address (a
# duplicate address overrides the earlier one), so each address appears
#
# ===========================================================================
# --- Recomp-level patches via mid-asm hooks (see docs/patches.md) ---------
# Code-region Xenia patches are inert at runtime in this recomp (guest .text
# is never executed), so they are applied to the RECOMPILED code instead: a
# hook is injected at a specific guest instruction address and a C++ function
# (defined in src/core/fable2_hooks.cpp) rewrites a register, mirroring the patch's
# intent. Codegen emits each hook's extern prototype automatically. Hooks are
# keyed by address in codegen (a duplicate address overrides the earlier one),
# so each address appears exactly once below.
#
# Unlock Website Items (Xenia "Unlock Website Items" by Guy). sub_8256E368 is
# the "is a website/Guild-chest item available" check. It is gated by the
# player's website-registration flags on the chest object (r4): GATE 1 = bit6
# of *(r4+0x90), GATE 1b = bit0 of *(r4+0x40). Only when BOTH pass does the
# type-0xf0 item lookup run and the item get GRANTED via a vtable call
# (bctrl at 0x8256E4CC); every other path funnels to the return-0 tail at
# 0x8256E4E0. We force each gate's bit-extract result to 1 (r9 after the
# GATE-1 rlwinm, r8 after the GATE-1b clrlwi) so the function always treats the
# player as registered and performs the real grant. The getters run at save
# load, so this populates the chest inventory on load.
[[midasm_hook]]
address = 0x8256E384
name = "fable2_hook_website_g1"
registers = ["r9"]
after_instruction = true
[[midasm_hook]]
address = 0x8256E3AC
name = "fable2_hook_website_g1b"
registers = ["r8"]
after_instruction = true

# Unlock Collectors Edition Content (Xenia "Unlock Collectors Edition Content"
# by Guy). Same shape: sub_824B3528 is the "is CE-chest content available"
# check, gated by GATE 1 = bit6 of *(r4+0x90) and GATE 1b = a bit of
# *(r4+0x28); only when both pass does the type-0x39 item lookup run and the
# content get GRANTED via a vtable call (bctrl at 0x824B3678). We force each
# gate's bit-extract result to 1 (r10 after the GATE-1 rlwinm, r9 after the
# GATE-1b rlwinm) so the function always treats the player as registered.
[[midasm_hook]]
address = 0x824B3540
name = "fable2_hook_ce_g1"
registers = ["r10"]
after_instruction = true
[[midasm_hook]]
address = 0x824B3568
name = "fable2_hook_ce_g1b"
registers = ["r9"]
after_instruction = true

# --- Unlock grant methods (make the getter report each item as granted) -----
# Forcing the two registration gates alone is not enough: after the gates the
# getter finds the item and calls a per-object GRANT vtable method, and the
# getter returns THAT method's result. For an unregistered player the grant
# method returns 0 (item not granted), so the getter reports "not available"
# and the chest stays locked. We force each grant method's return to 1.
#
# Website: sub_8256D940 is the website-chest vtable[1] "is this item new?"
# check. Its final instruction is `xori r3, r9, 1` at 0x8256D9E4; hook right
# after it and set r3 = 1 so the getter reports the item as granted.
[[midasm_hook]]
address = 0x8256D9E4
name = "fable2_hook_website_grantnew"
registers = ["r3"]
after_instruction = true

# Disable Motion Blur. In the camera's per-frame update (sub_822A47C0, the
# code that eases the camera's current values toward their targets), the
# current full-screen motion blur amount (camera +0xD4; the value scripts set
# through Camera.SetBlur / SetBlurCut / SetFullScreenMotionBlurCut) is handed
# to the renderer: `lfs f12, 0xd4(r31)` at 0x822A49E8, then
# `stfs f12, 0x7c(r11)`. Right after the load we zero f12 so the renderer
# always receives 0; the camera's own value (and script reads of it) is
# untouched. f12 is not read again before it is overwritten.
# Toggle: [patches] disable_motion_blur.
[[midasm_hook]]
address = 0x822A49E8
name = "fable2_hook_disable_motion_blur"
registers = ["f12"]
after_instruction = true
#
# CE: sub_824ACAE0 is the CE-chest grant vtable slot called from
# GetCEContent. Its entire body is `lbz r3, 993(r3)` (returns the byte at
# item+0x3E1, the "CE content available" flag). Hook right after it and set
# r3 = 1 so the getter reports the CE content as available.
[[midasm_hook]]
address = 0x824ACAE0
name = "fable2_hook_ce_grantavail"
registers = ["r3"]
after_instruction = true

# High Tick Rate (Xenia patch by Guy), code half. The Xenia patch NOPs the
# store at 0x8233AEB4 that writes the tick-rate double at 0x83319510 every
# time it runs, and patches that double (be8 0x83319511: 15.0 -> 30.0; written
# at load by src/core/fable2_patches.cpp). Guest .text never runs here, so the NOP was inert and
# the game overwrote the patched value. This hook runs BEFORE the store and,
# while [patches] high_tick_rate is true, jumps past it (= the NOP).
[[midasm_hook]]
address = 0x8233AEB4
name = "fable2_hook_high_tick_rate_skip_store"
registers = []
jump_address_on_true = 0x8233AEB8

# Higher HF Tick Rate (Xenia patch by Ultra), code half. Same function: the
# store at 0x8233AE98 (`stfd f0, -0x6ae8(r9)`) writes the HF tick double at
# 0x83319518 (30.0, copied from 0x833194F0) every time it runs and would undo
# the 30 -> 60 Hz data write (src/core/fable2_patches.cpp). Runs BEFORE the
# store and, while [patches] higher_hf_tick_rate is true, jumps past it.
[[midasm_hook]]
address = 0x8233AE98
name = "fable2_hook_high_hf_tick_rate_skip_store"
registers = []
jump_address_on_true = 0x8233AE9C

# Address-space scan fix (src/core/fable2_address_scan.cpp). sub_82B4DDD8
# finds an aligned block of address space by reserving one candidate address
# after another (step r28, size r26, limit r27, candidate r31); each taken
# candidate was a failed NtAllocateVirtualMemory call and an "[error]
# BaseHeap::AllocFixed attempting to reserve an already reserved range" line
# (~3,850 at startup). The hook runs at the loop head, before each attempt,
# and moves r31 to the first candidate whose range is actually free, so the
# game gets the same address without the failed calls. It returns true only
# when no candidate is left, jumping to the function's own "nothing found"
# exit (li r3, 0).
[[midasm_hook]]
address = 0x82B4DE50
name = "fable2_hook_address_scan_skip"
registers = ["r26", "r27", "r28", "r31"]
jump_address_on_true = 0x82B4DEF8

# Skip Intro Videos (just-harry's "Skip intro videos" patch from his
# Unofficial Xenia femtofork, as a hook). sub_822F4958 builds the boot video
# queue: slot 0 = microsoft_logo.bik, slot 1 = lionhead_logo.bik, slot 2 =
# terminator, then loops queueing slots until CompareString says "terminator".
# Right after the first CompareString (bl at 0x822F49B8) we report
# "terminator" (r3 = 0), so nothing is queued; the three strings are still
# constructed and released normally. Toggle: [patches] skip_intro_videos.
[[midasm_hook]]
address = 0x822F49B8
name = "fable2_hook_skip_intro_videos"
registers = ["r3"]
after_instruction = true

# Hero/dog black textures, fixed without CPU readback
# (plans/hero-dog-realtime-texture-morphing.md). The hero's and dog's skin
# textures are built by texture morphing. In the default "baked" mode the morph
# renderer (sub_82A69728) draws each mip into a scratch render target, resolves
# it to guest memory (the 0x12704000 scratch texture), locks that READONLY on
# the CPU and DXT-compresses it into the final texture (sub_83008E98). On a
# split-memory host that CPU read sees stale memory, so the result is black.
# The game also has a RealTimeTextureMorphing mode in which the morph is drawn
# straight into an uncompressed final texture and its mips are made on the
# GPU, so the CPU never reads the result. Every morph request becomes a morph
# job in sub_82A76018, which copies the request's realtime byte with
# `lbz r9, 0x20(r30)` at 0x82A7607C (then `stb r9, 0x60(r31)`); force it to 1.
# Toggle: [patches] realtime_texture_morphing.
[[midasm_hook]]
address = 0x82A7607C
name = "fable2_hook_realtime_texture_morphing"
registers = ["r9"]
after_instruction = true
