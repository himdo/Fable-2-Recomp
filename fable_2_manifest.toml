sdk_version = "0.10.0"
game_root = "."

[entrypoint]
file_path = "default.xex"
out_directory_path = "generated/default"
includes = ["fable2_switch_tables.toml"]

# setjmp/longjmp: the recompiler redirects these to native implementations.
# longjmp (0x82CA9260) restores the full guest state from the jmp_buf and
# calls RtlUnwind (thunk 0x832B25BC) on the unwind path.
# setjmp (0x83000200) stores the full guest state (f14-f31, r13-r31, VMX,
# CR, LR) to the jmp_buf, using the same layout longjmp restores.
longjmp_address = 0x82CA9260
setjmp_address = 0x83000200

# Conservative settings: no register optimizations
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

