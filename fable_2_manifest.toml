# original XenonRecomp/XenonAnalyse configuration).
#
# XenonRecomp fields with no ReXGlue equivalent (kept in XenonRecomp/fable2.toml):
#   - restgprlr_14 / savegprlr_14 / restfpr_14 / savefpr_14 / restvmx_14 /
#     savevmx_14 / restvmx_64 / savevmx_64 helper addresses
#     (register save/restore thunks found via byte-pattern scan):
#       restgprlr_14 = 0x82CA2C00   savegprlr_14 = 0x82CA2BB0
#       restfpr_14   = 0x82CA751C   savefpr_14   = 0x82CA74D0
#       restvmx_14   = 0x82FFFF68   savevmx_14   = 0x82FFFCD0
#       restvmx_64   = 0x82FFFFFC   savevmx_64   = 0x82FFFD64
#   - switch_table_file_path: ReXGlue has no separate switch-table file; the
#     XenonAnalyse tables are converted to [[switch_tables]] entries in
#     fable2_switch_tables.toml and pulled in via `includes` below.
#   - patch_file_path: none. The only available patch
#     ($SystemUpdate/su20076000_00000000) is a PIRS container, not a raw
#     XEX2 delta patch, so the recompiler runs against the unpatched
#     default.xex.

[project]
name = "fable_2"
sdk_version = "0.10.0"
game_root = "."

[entrypoint]
file_path = "default.xex"
out_directory_path = "generated/default"
includes = ["fable2_switch_tables.toml"]

# setjmp/longjmp: the recompiler redirects these to native implementations.
# longjmp (0x82CA9260) restores the full guest state from the jmp_buf and
# calls RtlUnwind (thunk 0x832B25BC) on the unwind path.
# setjmp (0x83000200) stores the full guest state (f14-f31, r13-r31, VMX,
# CR, LR) to the jmp_buf, using the same layout longjmp restores.
longjmp_address = 0x82CA9260
setjmp_address = 0x83000200

# Conservative settings: no register optimizations
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Invalid instruction skips: 32-bit values (big-endian) the recompiler skips
# over during its linear .text walk instead of analyzing them as functions.
#   0x00000000      -- zero padding between functions (not a valid PPC insn)
#   0x00485645      -- end-of-.text data table at 0x832B31E0 (185 words of
#                      offset data, 0x832B31E0-0x832B34C4); skip all 740 bytes
[[entrypoint.invalid_instructions]]
